<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nuwest.ai — Coming Soon</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Use your existing CSS file name. If your bucket has style.css, keep this: -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="brand" style="font-family:'Space Grotesk',sans-serif;">nuwest.ai</h1>
    <h1>Battle testing Incident Response with measurable outcomes</h1>
    <p class="lead">Join the list for early access and updates "we promise not to spam you."</p>

    <form id="subscribeForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name"  name="name"  type="text" required autocomplete="name"  maxlength="100">
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" autocomplete="organization-title" maxlength="100">

      </div>

      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" required autocomplete="email" maxlength="254">
      </div>

      <button type="submit">Notify me</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
